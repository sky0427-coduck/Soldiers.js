<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1d20" />
    <title>SOLDIERS // TRAINING</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="importmap">{
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }</script>
  </head>
  <body>
    <main id="app">
      <div id="render-root"></div>
      <section id="landing" class="screen active">
        <div class="landing-wash"></div>
        <img class="logo" src="/ICONS/LOGO.png" alt="SOLDIERS" />
        <div class="mode-actions">
          <button class="mode-button" data-mode="practice"><img src="/ICONS/practice_btn.png" alt="Practice" /><span>PRACTICE</span></button>
          <button class="mode-button" data-mode="cqb"><img src="/ICONS/CQB_btn.png" alt="CQB" /><span>CQB</span></button>
          <button class="mode-button" data-mode="war"><span>WAR</span></button>
        </div>
        <p class="landing-note">개인 전투 숙련도 평가 시스템</p>
      </section>
      <section id="map-screen" class="screen panel-screen">
        <div class="panel map-panel">
          <p class="eyebrow">CQB MAP</p>
          <h1>작전 지역 선택</h1>
          <div class="map-options">
            <button class="map-button" data-map="house_A"><strong>HOUSE A</strong><span>맵 A</span></button>
            <button class="map-button" data-map="house_B"><strong>HOUSE B</strong><span>맵 B</span></button>
          </div>
          <button class="text-button map-back">돌아가기</button>
        </div>
      </section>
      <section id="name-screen" class="screen panel-screen">
        <div class="panel">
          <p class="eyebrow" id="selected-mode">PRACTICE</p>
          <h1>작전 참가자</h1>
          <input id="player-name" maxlength="30" placeholder="반, 번호, 이름을 입력하세요" autocomplete="off" />
          <button id="begin-button" class="primary">시작</button>
          <button class="text-button back">돌아가기</button>
        </div>
      </section>
      <section id="hud" aria-live="polite">
        <div id="damage-vignette" aria-hidden="true"></div>
        <div class="hud-top"><div id="timer">02:30</div><div id="objective">점령 0 / 3</div></div>
        <div id="war-countdown" aria-live="assertive"></div>
        <div id="war-scoreboard"></div>
        <div id="level-banner"></div>
        <div id="crosshair"><i></i><b></b><em></em><strong></strong></div>
        <div id="hitmarker" aria-hidden="true"><i></i><b></b><em></em><strong></strong></div>
        <div id="capture"><div class="capture-copy">FLAG 점령 중</div><div class="capture-track"><span></span></div></div>
        <div id="health"><span>HP</span><div><i></i></div><b>14</b></div>
        <div id="ammo"><span id="weapon-name">M1911</span><b id="magazine">12</b><i>/</i><strong id="reserve">84</strong><small>재장전 2</small></div>
      </section>
      <section id="result" class="screen panel-screen">
        <div class="panel result-panel">
          <p class="eyebrow" id="result-mode">PRACTICE</p><h1 id="result-title">레벨 클리어!</h1><p id="result-score"></p>
          <div class="rank-box"><h2>기록</h2><ol id="rank-list"></ol></div><button id="return-button" class="primary">시작 화면</button>
        </div>
      </section>
      <div id="loader"><div></div><p>작전 구역 준비 중</p></div>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>
